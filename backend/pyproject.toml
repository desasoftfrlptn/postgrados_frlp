[project]
name = "backend"
version = "0.1.0"
description = "API de Posgrados FRLP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.16.2",
    "pydantic[email]>=2.14.2",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
