<!DOCTYPE html>
<html lang="es">
<head> 
    <meta charset="UTF-8">
    <style>
      body {
        font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px;}
        .container {background-color: #fff;max-width: 600px;margin:auto;border-radius:8px;overflow:hidden;}
        .header { background: #003366; padding: 20px; text-align: center; }
        .header img { height: 50px; }
        .content { padding: 24px; color: #333; line-height: 1.5; }
        .observacion { background: #fff8e1; border-left: 4px solid #ffa000; padding: 12px 16px; margin: 16px 0; }
        .footer { font-size: 12px; color: #888; text-align: center; padding: 16px; }  
        
        
    </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="{{logo_url}}" alt="UTN FRLP">
    </div>
    <div class="content">
      <h2>Tu legajo tiene observaciones</h2>
      <p>Hola {{nombre_aspirante}},</p>
      <p>Revisamos tu legajo de <strong>{{carrera}}</strong> y necesitamos que corrijas lo siguiente:</p>
      <div class="observacion">{{detalle_observacion}}</div>
      <p>Una vez que subas la corrección, tu legajo vuelve automáticamente a revisión.</p>
    </div>
    <div class="footer">
      Secretaría de Posgrado · UTN FRLP · {{fecha_envio}}
    </div>
  </div>
</body>
</html>
