name: CI Pipeline
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Verificación Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        working-directory: src/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Pruebas Backend
        working-directory: src/backend
        run: python -m pytest -q

      - name: Verificar sintaxis Python
        working-directory: src/backend
        run: python -m compileall -q src main.py

      - name: Verificar importación de FastAPI
        working-directory: src/backend
        env:
          SECRET_KEY: ci-test-secret-key
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
        run: python -c "from main import app; print(app.title)"

  frontend:
    name: Lint y Build Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: src/frontend
        run: npm ci

      - name: Ejecutar ESLint
        working-directory: src/frontend
        run: npm run lint

      - name: Pruebas Frontend
        working-directory: src/frontend
        run: npm run test:run

      - name: Build de producción
        working-directory: src/frontend
        run: npm run build
