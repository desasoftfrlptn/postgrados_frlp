# docker-compose.yml — Ambiente de desarrollo Fenix Posgrado

# Ejecutar: docker-compose up -d
# Detener:  docker-compose down
# Ver logs: docker-compose logs -f [servicio]

services:

  # ──────────────────────────────────────────
  # BASE DE DATOS PostgreSQL
  # ──────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: postgrado-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgrado_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgrado_dev_password}
      POSTGRES_DB: ${DB_NAME:-postgrado_dev}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgrado_user} -d ${DB_NAME:-postgrado_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────
  # BACKEND API (FastAPI)
  # ──────────────────────────────────────────
  backend:
    env_file:
      - path: ./.env
        required: false
      - path: ./src/backend/.env
        required: false
    build:
      context: ./src/backend
      dockerfile: Dockerfile.dev
    container_name: postgrado-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://${DB_USER:-postgrado_user}:${DB_PASSWORD:-postgrado_dev_password}@db:5432/${DB_NAME:-postgrado_dev}}"
      SECRET_KEY: ${SECRET_KEY:-${JWT_SECRET:-dev-secret-change-in-production}}
      STORAGE_PATH: /var/postgrado-storage
      ENVIRONMENT: development
      ADMIN_EMAIL: Desarrollowebutn2026@gmail.com
    ports:
      - "8000:8000"
    volumes:
      - ./src/backend:/app
      - postgrado-storage:/var/postgrado-storage
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ──────────────────────────────────────────
  # FRONTEND - PARA DEV
  # ──────────────────────────────────────────
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile.dev
    container_name: postgrado-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
      VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY:-}
      VITE_CALENDARIFIC_API_KEY: ${VITE_CALENDARIFIC_API_KEY:-}
      VITE_USE_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 3000 --strictPort

  # ──────────────────────────────────────────
  # ──────────────────────────────────────────
volumes:
  pgdata:
    name: postgrado-pgdata
  postgrado-storage:
    name: postgrado-storage

# ──────────────────────────────────────────────────────────────
# INSTRUCCIONES DE USO
#
# Primera vez:
#   cp .env.example .env
#   docker compose up -d
#   Las tablas se crean al iniciar FastAPI.
#
# Ver emails enviados por el sistema:
#
# Acceder a la base de datos:
#   docker exec -it postgrado-db psql -U postgrado_user -d postgrado_dev
#
# Si algo no funciona:
#   docker compose down && docker compose up -d --build
# ──────────────────────────────────────────────────────────────
